# yaml-language-server: $schema=../../schemas/facts-definition.schema.json
id: system-inventory
version: 1
description: Processes, services, and bounded filesystem tree inventory

inputs:
  tree-root:
    default: "."
  tree-max-depth:
    default: "3"

files:
  - id: tree-root
    path: "{{ inputs.tree-root }}"
    require: [exists, directory, readable]
    importance: required

processes:
  - id: node-process
    name: node
    importance: evidence
    redaction:
      strategy: mask
      patterns:
        - 'token=\S+'
        - 'password=\S+'
        - 'secret=\S+'
        - 'api[_-]?key=\S+'

services: []

artifacts:
  - id: tree-root-metadata
    path: "{{ inputs.tree-root }}"
    kind: directory-tree
    capture: metadata
    importance: evidence
