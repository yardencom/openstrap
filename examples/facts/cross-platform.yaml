# yaml-language-server: $schema=../../schemas/facts-definition.schema.json
id: core-environment-baseline
version: 1
description: Cross-platform facts for controller-selected execution contexts

inputs:
  # A workflow can bind this to a repo/project directory later.
  # The facts definition only names the input; it does not choose a target.
  workspace:
    type: path
    required: false
    default: "."

commands:
  # Commands describe executable entrypoints and runtime capabilities:
  # PATH resolution, executable bit, version, help/flag discovery, etc.
  - id: git
    name: git
  - id: ripgrep
    name: rg
    importance: optional
    maxOutputBytes: 32768

env:
  - id: executable-search-path
    names: [PATH, Path]
    redaction: none
  - id: home-directory
    names: [HOME, USERPROFILE]
    importance: evidence
    redaction:
      strategy: mask

files:
  # Files describe filesystem paths and path properties.
  # This workspace check is intentionally a file fact: it asks whether
  # the workflow-bound workspace path exists and is usable.
  - id: workspace
    path: "{{ inputs.workspace }}"
    require: [exists, directory, readable, writable]
    importance: optional

processes:
  # ssh-agent is normally observed as a user process on Unix-like hosts.
  # Windows OpenSSH agent is better modeled as a service.
  - id: ssh-agent
    name: ssh-agent
    importance: evidence
    platforms: [linux, macos]

packages:
  # Packages describe installed software records in package managers.
  # Commands and packages may overlap, but they answer different questions:
  # "can this executable run?" vs "what installed package record exists?"
  - id: openssl-package
    names: [openssl]
    manager: auto
    importance: evidence
  - id: package-manager-packages
    names: [npm, uv, chocolatey]
    manager: auto
    importance: optional

users:
  # Users are explicit identities. Runtime execution user is provenance
  # and should be captured automatically by the runner, not named here.
  - id: root-user
    name: root
    importance: evidence
    platforms: [linux, macos]
  - id: administrator-user
    name: Administrator
    importance: optional
    platforms: [windows]

groups:
  - id: admin-group
    name: admin
    importance: optional
    platforms: [macos]

services:
  - id: docker
    name: docker
    importance: optional

sessions:
  # Sessions are login/terminal/ssh contexts, not process entries.
  - id: interactive-session
    kind: interactive
    importance: evidence

artifacts:
  # Artifacts preserve evidence produced by a workflow or found at a path.
  # capture controls how much is retained: metadata, hash, or content.
  - id: workspace-log
    path: "{{ inputs.workspace }}/openstrap.log"
    kind: log
    capture: hash
    importance: evidence
    redaction:
      strategy: hash
