# yaml-language-server: $schema=../../schemas/openstrap-blueprint.schema.json
#
# scope, type and transport are not written here. A target with no provider is
# the machine openstrap runs on: scope host, type host, transport local.
targets:
  local:
    displayName: Local machine

requirements:
  - id: node-runtime
    target: local
    runtimes:
      node:
        status: present
        ready: true
        version: ">=18.0.0"

  - id: local-transport
    target: local
    transports:
      local:
        status: present
        ready: true

  - id: resources
    target: local
    cpu:
      cores:
        minimum: 1
    memory:
      totalBytes:
        minimum: 1

  - id: workspace-ready
    target: local
    paths:
      workspace:
        status: present
        exists: true
        type: directory
        readable: true
