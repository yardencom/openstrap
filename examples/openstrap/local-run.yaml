# yaml-language-server: $schema=../../schemas/openstrap-blueprint.schema.json
target:
  name: local
  scope: system
  type: machine
  displayName: Local machine
  transport: local
  requirements:
    - id: node-runtime
      runtimes:
        node:
          status: present
          ready: true
          version: ">=18.0.0"

    - id: local-transport
      transports:
        local:
          status: present
          ready: true

    - id: resources
      cpu:
        cores:
          minimum: 1
      memory:
        totalBytes:
          minimum: 1

    - id: workspace-ready
      paths:
        workspace:
          status: present
          exists: true
          type: directory
          readable: true
