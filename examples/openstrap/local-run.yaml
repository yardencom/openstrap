# yaml-language-server: $schema=../../schemas/openstrap-blueprint.schema.json
#
# scope, type and transport are not written here. A target with no provider is
# the machine openstrap runs on: scope host, type host, transport local.
targets:
  local:
    displayName: Local machine
    requirements:
      - id: node-runtime
        runtimes:
          node:
            status: present
            ready: true
            version: ">=18.0.0"

      - id: resources
        cpu:
          cores:
            minimum: 1
        memory:
          totalBytes:
            minimum: 1

      - id: workspace-ready
        paths:
          workspace:
            # The directory openstrap was run in. Said out loud rather than left to a name openstrap
            # knows the meaning of, so the same words mean the same thing on any machine.
            path: "."
            status: present
            exists: true
            type: directory
            readable: true
